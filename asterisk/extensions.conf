[general]
static = yes
writeprotect = yes
autofallthrough = yes

[globals]

; Nothing lands here: there is no anonymous endpoint, and this context is empty.
[default]

; Only authenticated endpoints use this context. No outbound routes.
[from-internal]
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

exten => 601,1,NoOp(Playback hello-world)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(hello-world)
 same => n,Wait(0.5)
 same => n,Hangup()

; 700 = AudioSocket bridge to the Python app on loopback.
; This Asterisk build has no UUID() function, so a random (version-4 shaped)
; UUID is built from an MD5 over per-call unique data. No shell is involved.
exten => 700,1,NoOp(AudioSocket bridge)
 same => n,Answer()
 same => n,Set(H=${MD5(${UNIQUEID}-${EPOCH}-${RAND()}-${RAND()})})
 same => n,Set(CALL_UUID=${H:0:8}-${H:8:4}-4${H:13:3}-a${H:17:3}-${H:20:12})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
 same => n,Hangup()

; 701 = Hebrew clinic line, 702 = Arabic clinic line. Same bridge as 700; each
; goes to its own local port, where the Python app runs that profile
; (EXTRA_PROFILES in .env: clinic_he on 9093, clinic_ar on 9094).
exten => 701,1,NoOp(AudioSocket bridge: clinic_he)
 same => n,Answer()
 same => n,Set(H=${MD5(${UNIQUEID}-${EPOCH}-${RAND()}-${RAND()})})
 same => n,Set(CALL_UUID=${H:0:8}-${H:8:4}-4${H:13:3}-a${H:17:3}-${H:20:12})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:9093)
 same => n,Hangup()

exten => 702,1,NoOp(AudioSocket bridge: clinic_ar)
 same => n,Answer()
 same => n,Set(H=${MD5(${UNIQUEID}-${EPOCH}-${RAND()}-${RAND()})})
 same => n,Set(CALL_UUID=${H:0:8}-${H:8:4}-4${H:13:3}-a${H:17:3}-${H:20:12})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:9094)
 same => n,Hangup()

; h = runs once when a call in this context ends, whoever hung up.
; For AudioSocket calls (700) it writes Asterisk's RTP statistics for the call
; to one line in /var/lib/voice-agent-rtp/<uuid>.txt; the Python app picks the
; file up and adds it to the call log. Calls without CALL_UUID (600, 601) skip it.
;   all        packets sent/received, lost (lp = phone->server, rlp = server->phone
;              as reported by the phone), jitter both ways, round-trip time
;   all_jitter / all_loss / all_rtt   min / max / average of the same
exten => h,1,GotoIf($["${CALL_UUID}" = ""]?done)
 same => n,Set(FILE(/var/lib/voice-agent-rtp/${CALL_UUID}.txt,,,a)=${CHANNEL(rtcp,all)}|${CHANNEL(rtcp,all_jitter)}|${CHANNEL(rtcp,all_loss)}|${CHANNEL(rtcp,all_rtt)})
 same => n(done),NoOp(call ended)
