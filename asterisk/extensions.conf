[general]
static = yes
writeprotect = yes
autofallthrough = yes

[globals]

; Nothing lands here: there is no anonymous endpoint, and this context is empty.
[default]

; Only authenticated endpoints use this context. No outbound routes.
[from-internal]
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

exten => 601,1,NoOp(Playback hello-world)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(hello-world)
 same => n,Wait(0.5)
 same => n,Hangup()

; 700 = AudioSocket bridge to the Python app on loopback.
; This Asterisk build has no UUID() function, so a random (version-4 shaped)
; UUID is built from an MD5 over per-call unique data. No shell is involved.
exten => 700,1,NoOp(AudioSocket bridge)
 same => n,Answer()
 same => n,Set(H=${MD5(${UNIQUEID}-${EPOCH}-${RAND()}-${RAND()})})
 same => n,Set(CALL_UUID=${H:0:8}-${H:8:4}-4${H:13:3}-a${H:17:3}-${H:20:12})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
 same => n,Hangup()
