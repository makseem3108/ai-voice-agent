; Minimal module set: PJSIP + echo/playback only.
; autoload=no means anything not listed here (chan_sip, chan_iax2, chan_skinny,
; chan_mgcp, chan_dahdi, AMI/ARI/HTTP, voicemail, CDR backends, ...) is NOT loaded.
[modules]
autoload = no

; --- core plumbing
load = res_timing_timerfd.so
load = res_sorcery_config.so
load = res_sorcery_memory.so
load = res_sorcery_astdb.so
load = res_security_log.so
load = res_rtp_asterisk.so
load = pbx_config.so

; --- PJSIP stack
load = res_pjproject.so
load = res_pjsip.so
load = res_pjsip_pubsub.so
load = res_pjsip_session.so
load = res_pjsip_authenticator_digest.so
load = res_pjsip_endpoint_identifier_user.so
load = res_pjsip_registrar.so
load = res_pjsip_nat.so
load = res_pjsip_sdp_rtp.so
load = res_pjsip_rfc3326.so
load = res_pjsip_caller_id.so
load = res_pjsip_dtmf_info.so
load = res_pjsip_logger.so
load = chan_pjsip.so

; --- codecs / file formats (G.711 calls, GSM prompt files)
load = codec_ulaw.so
load = codec_alaw.so
load = codec_gsm.so
load = format_gsm.so
load = format_pcm.so
load = format_wav.so

; --- dialplan applications
load = app_echo.so
load = app_playback.so

; --- phase 1: AudioSocket bridge to the Python app (ext 700)
load = res_audiosocket.so
load = app_audiosocket.so
load = func_md5.so          ; MD5() and RAND() are only used to build the per-call UUID
load = func_rand.so
