; PJSIP - single softphone endpoint, no trunks, no anonymous endpoint.
; Placeholders (__LIKE_THIS__) are rendered from .env at deploy time.

[global]
type = global
user_agent = voice-agent-pbx          ; do not leak the Asterisk version to scanners
endpoint_identifier_order = username  ; never match by IP, no anonymous fallback
; PJSIP always answers unknown users with the same 401 challenge it gives real
; ones (the chan_sip "alwaysauthreject=yes" behaviour is built in). Requests that
; cannot be matched to an endpoint are logged to the security log for fail2ban.
unidentified_request_count = 3
unidentified_request_period = 5
unidentified_request_prune_interval = 30

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Server has the public IP on its own interface (no server-side NAT); advertise
; it explicitly so SDP/Contact never carry a wrong address.
external_media_address = __PUBLIC_IP__
external_signaling_address = __PUBLIC_IP__

; ---------------------------------------------------------------- 1001 (softphone)
[1001]
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw
auth = 1001-auth
aors = 1001
; client is behind home NAT:
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no
ice_support = no
dtmf_mode = rfc4733
allow_transfer = no
allow_subscribe = no
rtp_timeout = 30                    ; drop a call after 30 s with no RTP (dead phone, lost network)
rtp_timeout_hold = 300              ; same, while the call is on hold

[1001-auth]
type = auth
auth_type = userpass
username = 1001
password = __SIP_1001_PASSWORD__

[1001]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30              ; also keeps the home-NAT pinhole open
minimum_expiration = 60
default_expiration = 300
maximum_expiration = 3600
